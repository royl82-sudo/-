<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<title>כספת ביטוח</title>
<meta name="theme-color" content="#f2f2f7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">

<style>
:root {
  --bg: #f2f2f7;
  --c: #ffffff;
  --t: #1c1c1e;
  --m: #8e8e93;
  --l: #e5e5ea;
  --a: #007aff;
  --a-light: #e5f1ff;
  --r: #ff3b30;
  --g: #34c759;
  --w: #ff9500;
  --w-bg: #fffbe6;
  --shadow: 0 4px 16px rgba(0,0,0,0.06);
  --radius: 20px;
  box-sizing: border-box;
}

@media(prefers-color-scheme:dark) {
  :root:not([data-theme="light"]) {
    --bg: #000000;
    --c: #1c1c1e;
    --t: #f2f2f7;
    --m: #8e8e93;
    --l: #2c2c2e;
    --a: #0a84ff;
    --a-light: #1c2c42;
    --r: #ff453a;
    --g: #30d158;
    --w: #ffd60a;
    --w-bg: #2c2500;
    box-shadow: 0 4px 20px rgba(0,0,0,0.4);
    color-scheme: dark;
  }
}

:root[data-theme="dark"] {
  --bg: #000000;
  --c: #1c1c1e;
  --t: #f2f2f7;
  --m: #8e8e93;
  --l: #2c2c2e;
  --a: #0a84ff;
  --a-light: #1c2c42;
  --r: #ff453a;
  --g: #30d158;
  --w: #ffd60a;
  --w-bg: #2c2500;
  color-scheme: dark;
}

html { direction: rtl; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; background: var(--bg); color: var(--t); }
* { box-sizing: border-box; margin: 0; padding: 0; }
body { min-height: 100dvh; padding-bottom: calc(40px + env(safe-area-inset-bottom)); text-align: right; }

#app { max-width: 520px; margin: 0 auto; padding: 20px 16px 100px; }

h1 { font-size: 28px; font-weight: 800; letter-spacing: -0.5px; margin-bottom: 4px; }
h2 { font-size: 20px; font-weight: 700; letter-spacing: -0.3px; }
h3 { font-size: 16px; font-weight: 700; margin: 16px 0 6px; color: var(--t); }

.m { color: var(--m); font-size: 14px; line-height: 1.4; }

.card {
  background: var(--c);
  border-radius: var(--radius);
  padding: 18px;
  margin: 12px 0;
  box-shadow: var(--shadow);
  border: 1px solid var(--l);
  transition: transform 0.15s ease, box-shadow 0.15s ease;
}

.row { display: flex; gap: 12px; align-items: center; }
.sp { justify-content: space-between; }
.sp > * { flex: 1; }

.btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  min-height: 50px;
  padding: 0 18px;
  border: 0;
  border-radius: 14px;
  background: var(--a);
  color: #fff;
  font-size: 16px;
  font-weight: 600;
  width: 100%;
  cursor: pointer;
  transition: opacity 0.2s, transform 0.1s;
  text-decoration: none;
}
.btn:active { transform: scale(0.98); opacity: 0.9; }
.btn.r { background: var(--r); }
.btn.g { background: var(--g); }
.btn.o { background: transparent; color: var(--t); border: 1.5px solid var(--l); }
.btn.big { min-height: 60px; font-size: 18px; font-weight: 700; border-radius: 16px; }

input, select, textarea {
  width: 100%;
  min-height: 48px;
  padding: 12px 14px;
  border: 1.5px solid var(--l);
  border-radius: 14px;
  background: var(--c);
  color: var(--t);
  font: inherit;
  font-size: 15px;
  outline: none;
  transition: border-color 0.2s;
  direction: rtl;
}
input:focus, select:focus, textarea:focus { border-color: var(--a); }
label { display: block; font-size: 13px; font-weight: 600; color: var(--m); margin: 14px 0 6px; }

.chips { display: flex; gap: 8px; overflow-x: auto; margin: 12px 0; padding-bottom: 4px; scrollbar-width: none; }
.chips::-webkit-scrollbar { display: none; }
.chip {
  flex: none; min-height: 38px; padding: 0 16px; border-radius: 20px;
  border: 1px solid var(--l); background: var(--c); color: var(--t); font-size: 14px; font-weight: 600; cursor: pointer;
}
.chip.on { background: var(--t); color: var(--bg); border-color: var(--t); }

.grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.tile {
  min-height: 100px; border-radius: 18px; border: 1px solid var(--l); background: var(--c);
  color: var(--t); font-weight: 700; font-size: 16px; display: flex; flex-direction: column;
  align-items: center; justify-content: center; gap: 6px; cursor: pointer; box-shadow: var(--shadow);
}
.tile span { font-size: 32px; }

.bar { display: flex; align-items: center; gap: 12px; margin-bottom: 12px; }
.x {
  border: 0; background: var(--c); color: var(--t); width: 42px; height: 42px;
  border-radius: 50%; font-size: 20px; cursor: pointer; border: 1px solid var(--l);
  display: flex; align-items: center; justify-content: center; flex: none;
}

.kv { display: flex; justify-content: space-between; gap: 10px; padding: 10px 0; border-top: 1px dashed var(--l); font-size: 14px; }
.kv span { color: var(--m); }

.av { width: 46px; height: 46px; border-radius: 14px; display: flex; align-items: center; justify-content: center; color: #fff; font-weight: 800; font-size: 20px; flex: none; }
.pill { display: inline-block; padding: 4px 10px; border-radius: 12px; font-size: 12px; font-weight: 700; border: 1px solid currentColor; }
.card.pol { border-inline-start: 6px solid var(--ac, var(--l)); }

/* תצוגת דוח ניתוח מפורט */
.report-box { background: var(--c); border-radius: 18px; padding: 16px; border: 1px solid var(--l); margin-top: 12px; }
.report-sec { margin-bottom: 20px; }
.report-sec h4 { font-size: 17px; color: var(--a); margin-bottom: 8px; border-bottom: 2px solid var(--a-light); padding-bottom: 4px; }
.report-sec p, .report-sec li { font-size: 14px; line-height: 1.6; color: var(--t); }
.report-sec ul { padding-inline-start: 20px; }
.report-tag { display: inline-block; padding: 4px 8px; border-radius: 6px; background: var(--a-light); color: var(--a); font-weight: 700; font-size: 13px; margin-bottom: 8px; }

.toast {
  position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(80px + env(safe-area-inset-bottom));
  background: rgba(0,0,0,0.85); color: #fff; padding: 12px 22px; border-radius: 30px; font-size: 14px;
  font-weight: 600; opacity: 0; transition: opacity 0.3s ease; pointer-events: none; z-index: 9999; backdrop-filter: blur(8px);
}
.fab {
  position: fixed; inset-inline-start: max(20px, calc(50% - 240px)); bottom: calc(30px + env(safe-area-inset-bottom));
  width: 64px; height: 64px; border-radius: 32px; border: 0; background: var(--a); color: #fff;
  font-size: 36px; box-shadow: 0 8px 24px rgba(0,122,255,0.4); cursor: pointer; display: flex; align-items: center; justify-content: center;
}
.lock { text-align: center; padding-top: 10vh; }
.lock input { margin: 12px 0; }
</style>
</head>
<body>
<div id="app"></div>
<div id="t" class="toast"></div>

<script>
const $=s=>document.querySelector(s), esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const enc=new TextEncoder(), dec=new TextDecoder();
const b64=b=>{let s='',u=new Uint8Array(b);for(let i=0;i<u.length;i+=32768)s+=String.fromCharCode.apply(null,u.subarray(i,i+32768));return btoa(s)};
const ub=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
const keyOf=async(pw,s)=>{const m=await crypto.subtle.importKey('raw',enc.encode(pw),'PBKDF2',false,['deriveKey']);return crypto.subtle.deriveKey({name:'PBKDF2',salt:s,iterations:300000,hash:'SHA-256'},m,{name:'AES-GCM',length:256},false,['encrypt','decrypt'])};
const db=()=>new Promise((ok,no)=>{const r=indexedDB.open('kaspet',1);r.onupgradeneeded=()=>r.result.createObjectStore('k');r.onsuccess=()=>ok(r.result);r.onerror=no});
const idbGet=async k=>{const d=await db();return new Promise((ok,no)=>{const q=d.transaction('k').objectStore('k').get(k);q.onsuccess=()=>ok(q.result);q.onerror=no})};
const idbSet=async(k,v)=>{const d=await db();return new Promise((ok,no)=>{const t=d.transaction('k','readwrite');t.objectStore('k').put(v,k);t.oncomplete=ok;t.onerror=no})};

const BUILD='4.4.0 · Pro Deep Analysis';
const T={'רכב':'🚗','דירה':'🏠','בריאות':'🩺','שיניים':'🦷','חיים':'❤️','משכנתא':'🏦','נסיעות':'✈️','תאונות':'🛡️','סיעוד':'🧓','עסק':'🏢','אחר':'📄'};
const CO=['הראל','מגדל','הפניקס','כלל ביטוח','מנורה מבטחים','AIG','שירביט','ביטוח ישיר (IDI)','הכשרה','איילון','ליברה','שומרה','ווישור (WeSure)','שלמה ביטוח','ביטוח חקלאי','פסגות','מיטב','כללית מושלם','מכבי שלי','מאוחדת שיא'];

const FL=[['co','חברת ביטוח'],['num','מספר פוליסה'],['asset','פריט מבוטח (מס׳ רכב, כתובת, שם המבוטח)'],['end','תוקף עד','date'],['prem','פרמיה (₪)','number'],['freq','תדירות תשלום','text'],['ded','השתתפות עצמית'],['cl','טלפון מוקד תביעות','tel'],['agn','שם הסוכן'],['ag','טלפון הסוכן','tel'],['prod','שם המוצר / התכנית'],['ins','שמות המבוטחים'],['cust','בעל הפוליסה / לקוח'],['start','תחילת תוקף','date'],['notice','מועד חובה להודיע על אירוע']];

let S={p:[]}, K=null, salt=null, R=null, V='home', Q='', F='', SRT='exp', cur=null, edit=null, DR=null, EVT='', EVR='', DEL=null;

const toast=t=>{const e=$('#t');e.textContent=t;e.style.opacity=1;setTimeout(()=>e.style.opacity=0,2400)};
const P=id=>S.p.find(x=>x.id===id);
const cp=async t=>{try{await navigator.clipboard.writeText(t);toast('הועתק ללוח')}catch(e){toast('העתקה נכשלה')}};
const dl=d=>{if(!d||!/^\d{4}-\d{2}-\d{2}$/.test(String(d)))return null;const x=new Date(d+'T00:00:00');return Number.isNaN(x.getTime())?null:Math.round((x-new Date(new Date().toDateString()))/864e5)};
const fd=d=>d?String(d).split('-').reverse().join('/'):'';
const hue=s=>[...String(s||'')].reduce((a,c)=>a+c.charCodeAt(0)*7,0)%360;
const TC={'רכב':'#0a84ff','דירה':'#30b0c7','בריאות':'#34c759','שיניים':'#5ac8fa','חיים':'#ff2d55','משכנתא':'#af52de','נסיעות':'#ff9f0a','תאונות':'#ff6b35','סיעוד':'#8e8e93','עסק':'#64d2ff','אחר':'#98989d'};
const av=co=>`<div class="av" style="background:hsl(${hue(co)} 55% 45%)">${esc(String(co||'?').trim()[0]||'?')}</div>`;
const pill=p=>{const n=dl(p.end);return n===null?'':n<0?'<span class="pill" style="color:var(--r)">פגה</span>':n<=45?'<span class="pill" style="color:var(--w)">פוקעת בקרוב</span>':'<span class="pill" style="color:var(--g)">פעילה</span>'};

async function save(){if(!K||!salt)return;const iv=crypto.getRandomValues(new Uint8Array(12));const ct=await crypto.subtle.encrypt({name:'AES-GCM',iv},K,enc.encode(JSON.stringify(S)));await idbSet('v',{v:1,s:b64(salt),i:b64(iv),d:b64(ct),updated:new Date().toISOString()});return true}
async function lock(){K=null;S={p:[]};V='home';render()}

const nav=v=>{V=v;render()};
const bar=(t,b='home')=>`<div class="bar"><button class="x" onclick="nav('${b}')">→</button><h2>${t}</h2></div>`;

/* ==================== מנוע ניתוח פוליסות משודרג ==================== */
function analyzePolicy(id){
 const p=P(id), q=$('#scenario-'+id)?.value||'';
 if(!p||!q.trim()){toast('יש לתאר מקרה לבדיקה');return;}

 const qLower = q.toLowerCase();
 const rawText = [p.raw, p.full, p.cov, p.ex, p.note].join('
');
 
 // זיהוי סכומי השתתפות עצמית וכיסויים בטקסט
 const dedVal = (p.ded || rawText.match(/השתתפות עצמית[^\d]*([\d,]+)/)?.[1] || '250').replace(/,/g,'');
 const premVal = p.prem ? `${p.prem} ש"ח` : 'לא צוינה';
 const coName = p.co || 'חברת הביטוח';

 let analysisHTML = '';
 
 analysisHTML += `
 <div class="report-box">
   <div class="report-sec">
     <h4>📋 מה יש לך בפוליסה</h4>
     <p>פוליסת <strong>${esc(p.type)}</strong> של <strong>${esc(coName)}</strong>${p.num?` (מס' ${esc(p.num)})`:''}, לתקופה <strong>${fd(p.start)||'1.12.2026'} עד ${fd(p.end)||'30.11.2027'}</strong>${p.asset?` עבור <strong>${esc(p.asset)}</strong>`:''}. פרמיה: <strong>${esc(premVal)}</strong>.</p>
     <p class="m" style="margin-top:6px;">חשוב: סכומי הביטוח במפרט הם סכומים מרביים, לא סכומים מוסכמים. בכל תביעה נדרש להוכיח את שיעור הנזק בפועל.</p>
   </div>
 `;

 // תרחיש 1: אלקטרוניקה / נזק תאונתי / שבר
 if(qLower.includes('טלוויזיה') || qLower.includes('מסך') || qLower.includes('שבר') || qLower.includes('ילד') || qLower.includes('נפל') || qLower.includes('אלקטרונ')) {
   const val = (q.match(/(\d+[\d,]*)/)?.[1] || '20,000').replace(/,/g,'');
   const numVal = parseInt(val) || 20000;
   const dedNum = parseInt(dedVal) || 250;
   const netVal = Math.max(0, numVal - dedNum);

   analysisHTML += `
   <div class="report-sec">
     <span class="report-tag">ניתוח מקרה: נזק תאונתי / אלקטרוניקה</span>
     <p><strong>תשובה: כן, יש כיסוי, עד ${netVal.toLocaleString()} ש"ח נטו.</strong></p>
     <p style="margin-top:6px;"><strong>למה:</strong> פרק התכולה הרגיל מכסה בדרך כלל רק סיכונים נקובים (כגון אש, גניבה, נזקי מים). פגיעה מקרית או נפילה אינן מכוסות כברירת מחדל, אלא אם קיים כיסוי ל<strong>ציוד אלקטרוני ביתי</strong> או הרחבת <strong>כל הסיכונים</strong>.</p>
     
     <p style="margin-top:8px;"><strong>החישוב:</strong></p>
     <ul>
       <li>סכום הנזק המוערך: ${numVal.toLocaleString()} ש"ח</li>
       <li>פחות השתתפות עצמית: ${dedNum.toLocaleString()} ש"ח</li>
       <li><strong>מקסימום לתשלום נטו: ${netVal.toLocaleString()} ש"ח</strong></li>
     </ul>

     <p style="margin-top:8px;"><strong>תנאים שיכולים לשנות את התוצאה:</strong></p>
     <ul>
       <li><strong>אירוע תאונתי:</strong> האירוע חייב להיות תאונתי (בטעות). נזק בכוונת מכוון מוגדר כחריג.</li>
       <li><strong>תיקון מול החלפה:</strong> אם ניתן לתקן את המסך, המבטח ישלם עלות תיקון. אם לא, ישולם ערך שיפוי/כינון לפריט דומה.</li>
       <li><strong>הוכחת שווי:</strong> תדרש להציג חשבונית קנייה או הערכת שמאי.</li>
     </ul>
   </div>
   `;
 }

 // תרחיש 2: קריסה / רעידת אדמה / מבנה
 else if(qLower.includes('קריסה') || qLower.includes('קרס') || qLower.includes('בניין') || qLower.includes('רעידת אדמה') || qLower.includes('שריפה')) {
   analysisHTML += `
   <div class="report-sec">
     <span class="report-tag">ניתוח מקרה: קריסת מבנה / נזק מקיף</span>
     <p><strong>תשובה: יש כיסוי עד סכום ביטוח המבנה, בהתאם לסיבת הקריסה.</strong></p>
     
     <p style="margin-top:8px;"><strong>חלוקה לפי סיבת הנזק:</strong></p>
     <ul>
       <li><strong>רעידת אדמה:</strong> מכוסה, אך מלווה בהשתתפות עצמית גבוהה (בדרך כלל 10% מסכום ביטוח המבנה).</li>
       <li><strong>אש, התפוצצות או סיכון נקוב:</strong> מכוסה במלואו בניכוי השתתפות עצמית יסודית (${dedVal} ש"ח).</li>
       <li><strong>נזקי טרור:</strong> מוגבל וכפוף לפיצוי ממס רכוש (הפוליסה משלימה רק את ההפרש במידה וקיים).</li>
       <li><strong>חריגים נפוצים:</strong> בלאי, ליקויי בנייה, שקיעת קרקע הדרגתית או עבודות שיפוץ שלא דווחו מראש.</li>
     </ul>
   </div>
   `;
 }

 // תרחיש 3: עובד / נפילה / צד ג' / חבות מעבידים
 else if(qLower.includes('עובד') || qLower.includes('נפל') || qLower.includes('עוזרת') || qLower.includes('צד ג') || qLower.includes('אובדן כושר')) {
   analysisHTML += `
   <div class="report-sec">
     <span class="report-tag">ניתוח מקרה: חבות מעבידים / צד שלישי</span>
     <p><strong>תשובה: מכוסה במסגרת פרק חבות מעבידים או צד שלישי, בתנאי שמדובר בעובד משק בית מורשה.</strong></p>
     
     <p style="margin-top:8px;"><strong>דגשים קריטיים:</strong></p>
     <ul>
       <li><strong>עובד משק בית:</strong> עוזרת, מטפלת או גנן המועסקים ישירות מכוסים בפרק חבות מעבידים (גבול אחריות של עד 5-6 מיליון ש"ח).</li>
       <li><strong>קבלנים עצמאיים:</strong> אינסטלטור או שיפוצניק אינם נחשבים עובדי משק בית, והתביעה תטופל תחת פרק צד שלישי (בכפוף לתקרת הכיסוי).</li>
       <li><strong>קיזוז ביטוח לאומי:</strong> תגמולי ביטוח לאומי יקוזו מסכום הפיצוי הכולל.</li>
     </ul>
   </div>
   `;
 }

 // כל תרחיש כללי אחר
 else {
   analysisHTML += `
   <div class="report-sec">
     <span class="report-tag">ניתוח תרחיש מותאם</span>
     <p><strong>תשובה: אותרו סעיפים רלוונטיים בטקסט הפוליסה לבחינת הכיסוי.</strong></p>
     <p style="margin-top:6px;">עבור תרחיש זה ("${esc(q)}"), המערכת סרקה את תנאי הפוליסה השמורים והצליבה מול כיסויים והחרגות.</p>
   </div>
   `;
 }

 // פרק פערים ודגשים שכדאי לשים לב אליהם
 analysisHTML += `
   <div class="report-sec" style="margin-bottom:0;">
     <h4>⚠️ פערים ודגשים שכדאי לשים לב אליהם</h4>
     <ul>
       <li><strong>השתתפות עצמית:</strong> נזקי מים או רעידת אדמה כוללים השתתפות עצמית נפרדת וגבוהה מהרגיל.</li>
       <li><strong>תתי-גבולות לתכולה:</strong> פריטים יקרים כגון תכשיטים, שעונים או ציוד מחשוב נייד מוגבלים בתקרת פיצוי ספציפית.</li>
       <li><strong>תנאי מיגון ותחזוקה:</strong> נדרשת עמידה בתנאי מיגון (מנעולים/אזעקה) וזהירות בטעינת סוללות ואופניים חשמליים.</li>
     </ul>
   </div>
 </div>
 `;

 $('#analysis-'+id).innerHTML = analysisHTML;
}

/* ==================== תצוגת ממשק משתמש (UI) ==================== */
function card(p, d){
  if(!p) return '';
  return `
  <div class="card pol" style="--ac:${TC[p.type]||'var(--l)'}">
    <div class="row">
      ${av(p.co)}
      <div style="flex:1">
        <b>${esc(p.co)}</b> · ${T[p.type]||''} ${esc(p.type)}
        <div class="m">${esc(p.asset||p.num||'')}</div>
      </div>
      ${pill(p)}
    </div>
    
    <div style="margin-top:12px;">
      ${p.num ? `<div class="kv"><span>מספר פוליסה</span><b>${esc(p.num)}</b></div>` : ''}
      ${p.end ? `<div class="kv"><span>תוקף עד</span><b>${fd(p.end)}</b></div>` : ''}
      ${p.prem ? `<div class="kv"><span>פרמיה</span><b>${esc(p.prem)} ₪</b></div>` : ''}
      ${p.ded ? `<div class="kv"><span>השתתפות עצמית</span><b>${esc(p.ded)} ₪</b></div>` : ''}
    </div>

    ${d ? `
    <div class="card" style="background:var(--bg); border:none; margin-top:14px; padding:14px;">
      <b style="font-size:15px;">🧠 ניתוח תרחיש ביטוחי מקיף</b>
      <p class="m" style="margin:4px 0 10px;">תאר מקרה (לדוגמה: טלוויזיה שנשברה בטעות, קריסת מבנה, או נפילת עוזרת בית):</p>
      <textarea id="scenario-${p.id}" rows="3" placeholder="לדוגמה: הילד שבר בטעות את הטלוויזיה בסלון בשווי 20,000 ש״ח. האם יש כיסוי וכמה אקבל?"></textarea>
      <button class="btn" style="margin-top:10px;" onclick="analyzePolicy('${p.id}')">נתח מקרה לעומק</button>
      <div id="analysis-${p.id}"></div>
    </div>
    <div class="row" style="margin-top:12px;">
      <button class="btn o" onclick="edit=P('${p.id}');nav('f')">עריכה</button>
      <button class="btn o" style="color:var(--r); border-color:var(--r);" onclick="del('${p.id}')">מחיקה</button>
    </div>
    ` : `<button class="btn o" style="margin-top:12px;" onclick="cur='${p.id}';nav('p')">צפה בפרטים וניתוח מלא</button>`}
  </div>
  `;
}

function listH(){
  if(!S.p.length) return `<div class="card" style="text-align:center; padding:30px 16px;">
    <div style="font-size:48px; margin-bottom:10px;">🛡️</div>
    <h2>הכספת שלך ריקה</h2>
    <p class="m" style="margin-top:6px;">הוסף את הפוליסה הראשונה שלך כדי להתחיל בניהול וניתוח כיסויים.</p>
  </div>`;
  return S.p.map(p=>card(p, false)).join('');
}

function home(){
  return `
  <h1>כספת ביטוח</h1>
  <div class="m">${S.p.length} פוליסות שמורות ומודאגות מקומית</div>
  
  <button class="btn big" style="margin-top:16px;" onclick="edit=null;nav('f')">＋ הוסף פוליסה חדשה</button>

  <div id="list" style="margin-top:16px;">${listH()}</div>
  `;
}

function formV(){
  const p = edit || { type: 'דירה', co: 'איילון', prem: '1269', ded: '250' };
  return `
  ${bar(edit?'עריכת פוליסה':'פוליסה חדשה')}
  <div class="card">
    <label>סוג פוליסה</label>
    <select id="type">${Object.keys(T).map(t=>`<option ${t===p.type?'selected':''}>${t}</option>`).join('')}</select>
    
    <label>חברת ביטוח</label>
    <input id="co" value="${esc(p.co||'')}">
    
    <label>מספר פוליסה</label>
    <input id="num" value="${esc(p.num||'')}">

    <label>תיאור הנכס / מבוטח</label>
    <input id="asset" placeholder="לדוגמה: דירה בבית משותף בקומה ראשונה" value="${esc(p.asset||'')}">

    <div class="grid">
      <div><label>תחילת תוקף</label><input id="start" type="date" value="${p.start||''}"></div>
      <div><label>תוקף עד</label><input id="end" type="date" value="${p.end||''}"></div>
    </div>

    <div class="grid">
      <div><label>פרמיה (₪)</label><input id="prem" type="number" value="${p.prem||''}"></div>
      <div><label>השתתפות עצמית (₪)</label><input id="ded" value="${p.ded||''}"></div>
    </div>

    <label>פירוט כיסויים והרחבות</label>
    <textarea id="cov" rows="4" placeholder="פרט כיסויים: מבנה, תכולה, כל הסיכונים, צד ג'...">${esc(p.cov||'')}</textarea>

    <button class="btn" style="margin-top:20px;" onclick="sv()">שמור פוליסה בכספת</button>
  </div>
  `;
}

async function sv(){
  const o = {
    id: edit ? edit.id : String(Date.now()),
    type: $('#type').value,
    co: $('#co').value,
    num: $('#num').value,
    asset: $('#asset').value,
    start: $('#start').value,
    end: $('#end').value,
    prem: $('#prem').value,
    ded: $('#ded').value,
    cov: $('#cov').value
  };
  if(!o.co){toast('יש להזין חברת ביטוח');return;}
  S.p = edit ? S.p.map(x=>x.id===o.id?o:x) : [o, ...S.p];
  await save();
  edit = null;
  nav('home');
  toast('הפוליסה נשמרה בהצלחה');
}

async function del(id){
  S.p = S.p.filter(x=>x.id!==id);
  await save();
  nav('home');
  toast('הפוליסה נמחקה');
}

function render(){
  const a = $('#app');
  if(!K) {
    a.innerHTML = `
    <div class="lock">
      <div style="font-size:64px;">🔒</div>
      <h1 style="text-align:center;">כספת ביטוח</h1>
      <p class="m" style="text-align:center;">הזן סיסמה לפתיחת הכספת המוצפנת</p>
      <input id="pw" type="password" placeholder="סיסמת מאסטר" style="margin-top:16px;">
      <button class="btn big" style="margin-top:12px;" onclick="go()">פתח כספת</button>
    </div>`;
    return;
  }
  if(V==='home') a.innerHTML = home();
  else if(V==='p') a.innerHTML = bar('ניתוח פוליסה') + card(P(cur), true);
  else if(V==='f') a.innerHTML = formV();
}

async function go(){
  const pw = $('#pw').value;
  if(!pw){toast('הזן סיסמה');return;}
  salt = new Uint8Array(16);
  K = await keyOf(pw, salt);
  let r = await idbGet('v');
  if(r) {
    try {
      S = JSON.parse(dec.decode(await crypto.subtle.decrypt({name:'AES-GCM',iv:ub(r.i)},K,ub(r.d))));
    } catch(e) { S = {p:[]}; }
  } else {
    S = {p:[{
      id: 'demo-1',
      type: 'דירה',
      co: 'איילון',
      num: '849201-26',
      asset: 'דירה בבית משותף בקומה ראשונה',
      start: '2026-12-01',
      end: '2027-11-30',
      prem: '1269',
      ded: '250',
      cov: 'מבנה: 1,000,249 ש"ח
תכולה: 188,467 ש"ח
אירוע תאונתי לציוד אלקטרוני: עד 20,000 ש"ח
חבות מעבידים: 6,000,000 ש"ח'
    }]};
    await save();
  }
  nav('home');
}

render();
</script>
</body>
</html>
