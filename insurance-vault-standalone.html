async function queueScan(inp){const files=[...inp.files];if(!files.length)return;SCAN_Q=files;SCAN_CUR=0;processNextScan()}
async function processNextScan(){if(SCAN_CUR>=SCAN_Q.length){$('#scanOut').innerHTML+='<div class="card"><b>סיימנו את כל הקבצים.</b></div>';return}

async function scanOne(file){const out=$('#scanOut');out.innerHTML='<div class="card">מחלץ טקסט מכל העמודים…</div>';
let text='',pages=0,docType='פוליסה מלאה';
try{
if(file.type==='application/pdf'||file.name.toLowerCase().endsWith('.pdf')){const r=await extractPdfAll(file);text=r.text;pages=r.pages}
else{text=await extractImageText(file);pages=1}
}catch(e){out.innerHTML=`<div class="card"><b>החילוץ נכשל</b><div class="mut">${esc(e.message||'שגיאה')}</div><button class="btn" onclick="nextScan()">המשך לקובץ הבא</button></div>`;return}
if(/דף רשימה|דף מידע|הצעת חידוש|הצעה לחידוש/i.test(text))docType=/הצעת חידוש/.test(text)?'הצעת חידוש':'דף רשימה';
else if(/נספח/.test(text))docType='נספח';
else if(/אישור ביטוח|אישור קיום/.test(text))docType='אישור ביטוח';
const coHit=findCo(text);
let aiFields=null,usedAI=false;
if(!S.settings.localOnly){
const ok=confirm(`לשלוח את המסמך "${file.name}" ל־AI (${S.settings.aiProvider}) לצורך חילוץ? אפשר לסרב ולהשתמש בחילוץ מקומי בלבד.`);
if(ok){try{aiFields=await aiExtract(text.slice(0,60000),file.name);usedAI=true}catch(e){toast('AI נכשל — עובר לחילוץ מקומי')}}}
const local=localExtract(text,coHit);
const merged=mergeFields(local,aiFields);
showQC(file.name,docType,pages,text,merged,usedAI,coHit);}
function nextScan(){SCAN_CUR++;processNextScan()}
function localExtract(text,coHit){const find=re=>{const m=text.match(re);return m?m[1].trim():''};
const dateRe=/(20\d{2})[-/.](\d{1,2})[-/.](\d{1,2})|(\d{1,2})[-/.](\d{1,2})[-/.](20\d{2})/g;const dates=[...text.matchAll(dateRe)].map(m=>{if(m[1])return `${m[1]}-${String(m[2]).padStart(2,'0')}-${String(m[3]).padStart(2,'0')}`;return `${m[6]}-${String(m[5]).padStart(2,'0')}-${String(m[4]).padStart(2,'0')}`});
const premM=text.match(/פרמיה[^0-9]{0,20}([\d,]+\.?\d*)/)||text.match(/([\d,]+\.?\d*)\s*₪/);
const numM=text.match(/מספר פוליסה[^0-9]{0,15}([0-9\-]{5,})/)||text.match(/פוליסה\s*(?:מס['’]?|מספר)?\s*[:#]?\s*([0-9\-]{5,})/);
let freq='';if(/שנתי/.test(text))freq='שנתי';else if(/רבעוני/.test(text))freq='רבעוני';else if(/חצי שנתי/.test(text))freq='חצי שנתי';else if(/חודשי/.test(text))freq='חודשי';
return{co:coHit?coHit.name:'',num:numM?numM[1]:'',start:dates[0]||'',end:dates[1]||dates[0]||'',prem:premM?premM[1].replace(/,/g,''):'',freq,ded:find(/השתתפות עצמית[^0-9]{0,25}([^\n]{0,60})/)||'',asset:find(/מספר רכב[^0-9]{0,10}([0-9\-]{5,})/)||'',cust:'',ins:'',prod:'',cl:find(/מוקד[^0-9]{0,20}([0-9*\- ]{7,})/)||'',cov:'',ex:'',note:''}}
function mergeFields(local,ai){const fields=[];const labels={co:'חברת ביטוח',num:'מספר פוליסה',start:'תחילת תוקף',end:'תאריך סיום',prem:'פרמיה',freq:'תדירות תשלום',ded:'השתתפות עצמית',asset:'פריט מבוטח',cust:'בעל הפוליסה',ins:'מבוטחים',prod:'שם המוצר',cl:'מוקד תביעות'};
for(const k of Object.keys(labels)){let v='',status='missing',conf=0,page='';
if(ai&&ai[k]!=null&&String(ai[k]).trim()){v=String(ai[k]);status=ai._meta&&ai._meta[k]&&ai._meta[k].status?ai._meta[k].status:'explicit';conf=ai._meta&&ai._meta[k]&&ai._meta[k].conf!=null?ai._meta[k].conf:85;page=ai._meta&&ai._meta[k]&&ai._meta[k].page?ai._meta[k].page:''}
else if(local[k]){v=String(local[k]);status=k==='co'?'explicit':'inferred';conf=k==='co'?80:55}
fields.push({key:k,label:labels[k],value:v,status,conf,page})}
return fields}
function showQC(fileName,docType,pages,text,fields,usedAI,coHit){const out=$('#scanOut');
const flags=[];if(!fields.find(f=>f.key==='co').value)flags.push('חברת ביטוח לא זוהתה — חובה למלא ידנית');if(!fields.find(f=>f.key==='num').value)flags.push('מספר פוליסה חסר');if(!fields.find(f=>f.key==='freq').value)flags.push('תדירות לא זוהתה — העלות החודשית לא תחושב עד שתאומת');if(!fields.find(f=>f.key==='end').value)flags.push('תוקף לא זוהה');
out.innerHTML=`<div class="card"><h3>בקרת איכות — ${esc(fileName)}</h3><div class="mut">סוג מסמך: ${esc(docType)} · ${pages} עמודים · ${usedAI?'חילוץ AI + מקומי':'חילוץ מקומי בלבד'} ${coHit?`· חברה זוהתה בביטחון ${coHit.conf}%`:''}</div>
${flags.length?`<div style="background:var(--redBg);border-radius:12px;padding:12px;margin:10px 0"><b style="color:var(--red)">דגלים אדומים</b><ul style="margin:6px 0;padding-inline-start:18px">${flags.map(f=>`<li>${esc(f)}</li>`).join('')}</ul></div>`:''}
<table class="table"><tr><th>שדה</th><th>תוצאה</th><th>מצב</th></tr>${fields.map((f,i)=>`<tr><td>${esc(f.label)}</td><td><input id="qc-${i}" value="${esc(f.value)}" style="margin:0"></td><td><span class="${f.status==='explicit'?'qc-ok':f.status==='inferred'?'qc-mid':'qc-bad'}">${f.status==='explicit'?'מפורש':f.status==='inferred'?'הוסק':'חסר'}</span> ${f.conf?f.conf+'%':''} ${f.page?'(עמ׳ '+f.page+')':''}</td></tr>`).join('')}</table>
<label>סוג ביטוח</label><select id="qc-type">${Object.keys(TYPES).map(t=>`<option>${t}</option>`).join('')}</select>
<label>כיסויים (שורה לכל כיסוי)</label><textarea id="qc-cov" rows="4"></textarea>
<label>חריגים</label><textarea id="qc-ex" rows="3"></textarea>
<div class="row"><button class="btn" onclick="saveQC(${fields.length},'${esc(docType)}')">אשר ושמור לכספת</button><button class="btn o" onclick="nextScan()">דלג</button></div><div class="small">שמירה רק לאחר אישור שלך. נתון שהוסק מסומן כהוסק — לעולם לא כוודאי.</div></div>`;
window._qcFields=fields;window._qcText=text}
async function saveQC(n,docType){const f={};window._qcFields.forEach((fld,i)=>{f[fld.key]=document.getElementById('qc-'+i).value.trim()});
const q=window._qcFields.map(fld=>({label:fld.label,value:document.getElementById('qc-'+window._qcFields.indexOf(fld)).value.trim(),status:fld.status,conf:fld.conf,page:fld.page}));
const p=normalizePolicy({type:document.getElementById('qc-type').value,co:f.co,num:f.num,start:f.start,end:f.end,prem:f.prem,freq:f.freq,ded:f.ded,asset:f.asset,cust:f.cust,ins:f.ins,prod:f.prod,cl:f.cl,cov:document.getElementById('qc-cov').value,ex:document.getElementById('qc-ex').value,docType,quality:q,raw:window._qcText.slice(0,8000)});
S.p.unshift(p);logHist('סריקת פוליסה',p.co+' · '+p.num);const ok=await saveQuiet();if(!ok)return;toast('הפוליסה נשמרה');nextScan()}
async function extractPdfAll(file){if(S.settings.localOnly)throw new Error('במצב מקומי בלבד לא נטענות ספריות PDF חיצוניות. אפשר לייבא טקסט שהודבק מ־Claude.');
await loadScript('https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js');pdfjsLib.GlobalWorkerOptions.workerSrc='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
const doc=await pdfjsLib.getDocument({data:await file.arrayBuffer()}).promise;let all='';for(let i=1;i<=doc.numPages;i++){const pg=await doc.getPage(i);const tc=await pg.getTextContent();const lines={};for(const it of tc.items){const y=Math.round(it.transform[5]);(lines[y]=lines[y]||[]).push(it.str)}all+=Object.keys(lines).sort((a,b)=>b-a).map(y=>lines[y].join(' ')).join('\n')+`\n--- עמוד ${i} ---\n`;if(i%5===0){const el=$('#scanOut');if(el)el.innerHTML=`<div class="card">מחלץ… עמוד ${i} מתוך ${doc.numPages}</div>`}}
return{text:all,pages:doc.numPages}}
async function extractImageText(file){if(S.settings.localOnly)throw new Error('במצב מקומי בלבד לא נטען OCR חיצוני. אפשר להדביק טקסט או להשתמש בייבוא.');
await loadScript('https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js');
const {data:{text}}=await Tesseract.recognize(file,'heb+eng');return text}
function loadScript(src){return new Promise((ok,no)=>{if(document.querySelector(`script[src="${src}"]`))return ok();const e=document.createElement('script');e.src=src;e.onload=ok;e.onerror=()=>no(new Error('לא ניתן לטעון ספריית סריקה — בדוק אינטרנט'));document.head.appendChild(e)})}

function coverageScore(){
let score=0;
const has=t=>S.p.some(p=>p.type===t);
const weights=[['רכב',18],['דירה',18],['בריאות',20],['חיים',20],['משכנתא',8],['נסיעות',4],['תאונות',6],['סיעוד',6]];
for(const [t,w] of weights){if(has(t)) score+=w;}
const expiring=S.p.filter(p=>{const n=dl(p.end);return n!==null&&n<0}).length;
if(expiring) score=Math.max(0,score-expiring*6);
const missingFreq=S.p.filter(p=>p.prem&&!p.freq).length;
if(missingFreq) score=Math.max(0,score-missingFreq*2);
score=Math.min(100,Math.round(score));
let grade=score>=85?'מצוין':score>=65?'טוב':score>=45?'בסיסי':'דורש חיזוק';
let summary='';
if(!has('חיים')) summary+='חסר ביטוח חיים. ';
if(!has('בריאות')) summary+='חסר ביטוח בריאות. ';
if(!has('דירה')) summary+='חסר ביטוח דירה. ';
if(!has('רכב')) summary+='חסר ביטוח רכב. ';
if(!summary) summary='כיסוי רחב — כדאי לבדוק חפיפות ועלויות.';
return {score, grade, summary:summary.trim()};
}

function smartAnswer(q){

if(low.includes('פוקע')||low.includes('פג')){const e=expiringSoon(); if(!e.length) return 'אין פוליסות שפוקעות ב-45 הימים הקרובים לפי התאריכים בכספת.'; return 'פוקעות בקרוב: '+e.map(p=>p.co+' · '+p.type+' — '+fd(p.end)+' ('+remTxt(p)+')').join(' ; ');}
if(low.includes('כפל')||low.includes('חפיפה')||low.includes('כפול')){const d=dupHints(); return d.includes('לא נמצאו')?'לא מצאתי חפיפה ברורה לפי סוג + מבוטח.':('מצאתי חשד לחפיפה: '+d.replace(/<[^>]+>/g,' '));}
if(low.includes('ציון')||low.includes('כיסוי')){const cs=coverageScore(); return 'ציון הכיסוי שלך הוא '+cs.score+' / 100 ('+cs.grade+'). '+cs.summary;}
const hits=lsearch(q,S.p);
if(!hits.length) return 'לא מצאתי התאמה בפוליסות שלך לשאלה הזו. נסה לנסח אחרת, או בדוק שהפוליסה הרלוונטית נסרקה ונשמרה.';

}

function detectDocStatus(text){
  const t=String(text||'');
  const isDraft=t.includes('טיוטה בלבד')||t.includes('טיוטה');
  const isProposal=t.includes('הצעה לביטוח');
  const isCheckCopy=t.includes('עותק לבדיקה');
  if(isDraft) return {status:'draft',label:'טיוטה בלבד - לא פוליסה בתוקף',sev:'bad'};
  if(isProposal&&isCheckCopy) return {status:'proposal',label:'הצעה / עותק לבדיקה - דורש אימות שהפכה לפוליסה',sev:'warn'};
  if(isProposal) return {status:'proposal',label:'הצעה לביטוח - לא פוליסה סופית',sev:'warn'};
  if(isCheckCopy) return {status:'check',label:'עותק לבדיקה - יש לוודא מול הסוכן',sev:'warn'};
  return {status:'final',label:'מסמך סופי לפי הטקסט',sev:'ok'};
}

function analyzePolicyDeep(p){
  const txt=(p.full||'')+' '+(p.raw||'')+' '+(p.cov||'')+' '+(p.ex||'')+' '+(p.note||'');
  const doc=detectDocStatus(txt+' '+((p.docStatusText||'')));
  const isVaad=isVaadPolicy(p,txt);
  const chapters=vaadChaptersFor(p);
  const deds=vaadDeductiblesFor(p);
  const isAyalon=p.num==='52-38-078644/25';
  const specials=isAyalon?AYALON_SPECIALS:(p.specials||[]);
  const gaps=isAyalon?AYALON_GAPS:(p.gaps||[]);
  const warnings=[];
  if(doc.status!=='final') warnings.push({sev:'high',t:doc.label,d:'יש לאמת מול הסוכן האם ההצעה הפכה לפוליסה סופית ומה מספרה.'});
  if(p.end&&dl(p.end)!==null&&dl(p.end)<0) warnings.push({sev:'high',t:'תקופת הביטוח פגה',d:'התוקף הסתיים ב-'+fd(p.end)+'. אם לא חודשה, אין כיסוי.'});
  else if(p.end&&dl(p.end)!==null&&dl(p.end)<=45) warnings.push({sev:'med',t:'פוקעת בקרוב',d:'נותרו '+dl(p.end)+' ימים עד '+fd(p.end)+'.'});
  if(p.prem&&!p.freq) warnings.push({sev:'med',t:'תדירות לא מאומתת',d:'אם העמודה במפרט היא פרמיה שנתית, התדירות היא שנתי. לא מניחים חודשי.'});
  if(p.freq==='חודשי'&&p.co==='איילון'&&isVaad) warnings.push({sev:'high',t:'חשד לטעות בתדירות',d:'בפוליסות ועד של איילון הפרמיה במפרט היא שנתית. בדוק אם סומן חודשי בטעות - זה מנפח פי 12.'});
  if(isVaad&&p.cust&&!p.cust.includes('ועד')) warnings.push({sev:'med',t:'המבוטח אינו ועד בית?',d:'בפוליסת ועד המבוטח הוא הוועד, לא נציג הוועד. ודא שהשדה הזה נכון.'});
  const premNote=p.prem?(p.freq==='שנתי'?'פרמיה שנתית '+p.prem+' ש"ח = כ-'+Math.round(Number(p.prem)/12)+' ש"ח לחודש מחושב.':'פרמיה '+p.prem+' ש"ח, תדירות: '+(p.freq||'לא ידועה - לא מחשבים כחודשי')):'פרמיה לא ידועה';
  return {doc,isVaad,chapters,deds,specials,gaps,warnings,premNote,isAyalon};
}
